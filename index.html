<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Пульт квеста</title>
<style>
  :root { --bg:#0b0e14; --card:#171b26; --line:#2b3242; --text:#eef0f5; --muted:#8d95a6; --gold:#e8c97a; --ok:#5dd28a; --bad:#ff7a70; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; padding:88px 14px 30px; background:var(--bg); color:var(--text); font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  h1 { margin:0 0 4px; font-size:20px; }
  #now { margin:0 0 16px; color:var(--muted); font-size:14px; }
  #now b { color:var(--gold); font-size:18px; }
  .pause { width:100%; padding:16px; margin-bottom:12px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:16px; font-weight:600; }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  .q { padding:14px 12px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--text); text-align:left; font-size:13px; line-height:1.3; }
  .q b { display:block; font-size:22px; color:var(--gold); margin-bottom:2px; }
  .q.active, .pause.active { border-color:var(--gold); background:#2a2417; }
  .q:active, .pause:active { transform:scale(.97); }
  button[disabled] { opacity:.5; }
  #log { margin-top:18px; padding:12px; border-radius:10px; background:var(--card); border:1px solid var(--line); font:13px/1.5 ui-monospace,Menlo,monospace; white-space:pre-wrap; word-break:break-word; min-height:60px; color:var(--muted); }
  .media-upload-link { display:inline-block; margin:0 0 14px; padding:0; border:0; background:none; color:var(--gold); font:inherit; font-size:14px; }
  #vkMediaUploadPanel { display:none; position:fixed; z-index:99999; inset:0; overflow:auto; padding:20px 14px 36px; background:var(--bg); }
  #vkMediaUploadPanel .upload-card { max-width:720px; margin:0 auto 14px; padding:16px; border:1px solid var(--line); border-radius:14px; background:var(--card); }
  #vkMediaUploadPanel h2 { margin:0 0 10px; font-size:20px; }
  #vkMediaUploadPanel p { color:var(--muted); }
  #vkMediaUploadPanel button { padding:12px 14px; margin:6px 6px 0 0; border:0; border-radius:10px; background:#3478f6; color:white; font:inherit; font-weight:700; }
  #vkMediaUploadPanel button.secondary { background:#343b4b; }
  #vkMediaUploadPanel button:disabled { opacity:.55; }
  #vkMediaUploadStatus { min-height:64px; padding:12px; border-radius:10px; background:#050608; color:var(--muted); white-space:pre-wrap; word-break:break-word; font:13px/1.5 ui-monospace,Consolas,monospace; }
  #vkMediaManifest { display:none; width:100%; height:180px; margin-top:10px; padding:10px; border:1px solid var(--line); border-radius:8px; background:#0b0e14; color:var(--text); font:11px/1.4 ui-monospace,Consolas,monospace; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
</style>
</head>
<body>
  <h1>Пульт квеста</h1>
  <button class="media-upload-link" id="openVkMediaUpload">Загрузить фото в VK →</button>
  <div id="now">Сейчас у туристов: <b>—</b></div>

  <button class="pause" data-n="0">0 · Пауза (экран ожидания)</button>
  <div class="grid" id="grid"></div>

  <div id="log">Подключаюсь…</div>

  <section id="vkMediaUploadPanel">
    <div class="upload-card">
      <h2>Загрузка фотографий в VK</h2>
      <p>Фотографии будут сохранены под вашим аккаунтом VK без публикации поста и без альбома сообщества. Нужен интернет без ограничений для разовой загрузки исходников с GitHub.</p>
      <button id="vkMediaUploadStart" class="secondary">Загрузить картинки из GitHub</button>
      <button id="vkMediaUploadClose" class="secondary">Назад к пульту</button>
    </div>
    <div class="upload-card">
      <div id="vkMediaUploadStatus">Нажмите «Загрузить картинки из GitHub».</div>
      <button id="vkMediaManifestDownload" class="secondary" disabled>Скачать vk-media.js</button>
      <button id="vkMediaManifestCopy" class="secondary" disabled>Скопировать манифест</button>
      <textarea id="vkMediaManifest" readonly></textarea>
    </div>
  </section>

<script src="vk-bridge.min.js"></script>
<script src="vk-media.js?v=2"></script>
<script>
(() => {
  const images = [
    ...Array.from({ length: 14 }, (_, i) => ({ repo: "dynamic-guide", path: `images/deshi/${i + 1}.jpeg` })),
    ...["atbash","brail","caesar","engalph","klavanouta","klavatelef","kvadratpolibiya","morze","pigpen","polybiy","rot13","rusalph","ruspolibiy","tablmend"]
      .map(name => ({ repo: "dynamic-guide", path: `images/shifrs/${name}.jpeg` })),
    ...["maptiles/bg_0_0.jpg","maptiles/dt_0_0.jpg","maptiles/dt_0_1.jpg"]
      .map(path => ({ repo: "dynamic-guide", path })),
    ...["president.jpeg","bulak shas.jpeg","bulakdo1957.jpeg","parad.jpeg"]
      .map(path => ({ repo: "vkaguide", path: `images/${path}` }))
  ];
  const uploaded = {};
  const version = "5.199";

  function init() {
    const panel = document.getElementById("vkMediaUploadPanel");
    const openButton = document.getElementById("openVkMediaUpload");
    if (!panel || !openButton) return;
    const status = document.getElementById("vkMediaUploadStatus");
    const startButton = document.getElementById("vkMediaUploadStart");
    const closeButton = document.getElementById("vkMediaUploadClose");
    const downloadButton = document.getElementById("vkMediaManifestDownload");
    const copyButton = document.getElementById("vkMediaManifestCopy");
    const manifestArea = document.getElementById("vkMediaManifest");

    function showStatus(text, bad = false) {
      status.textContent = text;
      status.style.color = bad ? "#ff7a70" : "#a6adbb";
    }
    function manifestText() {
      const values = Object.assign({}, window.VK_MEDIA || {}, uploaded);
      return "window.VK_MEDIA = " + JSON.stringify(values, null, 2) + ";\n" +
        "window.vkMediaUrl = window.vkMediaUrl || function (repo, path) {\n" +
        "  if (!path || /^(https?:|data:|blob:)/i.test(path)) return path;\n" +
        "  return window.VK_MEDIA[repo + '/' + path] || path;\n" +
        "};\n";
    }
    function refreshManifest() {
      manifestArea.value = manifestText();
      manifestArea.style.display = "block";
      downloadButton.disabled = false;
      copyButton.disabled = false;
    }
    openButton.addEventListener("click", () => { panel.style.display = "block"; });
    closeButton.addEventListener("click", () => { panel.style.display = "none"; });

    downloadButton.addEventListener("click", () => {
      const blob = new Blob([manifestText()], { type: "text/javascript;charset=utf-8" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "vk-media.js";
      link.click();
      setTimeout(() => URL.revokeObjectURL(link.href), 1500);
    });
    copyButton.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(manifestText());
        showStatus("Манифест скопирован. Его можно вставить вместо содержимого vk-media.js.");
      } catch (_) {
        manifestArea.focus();
        manifestArea.select();
        showStatus("Автокопирование недоступно. Текст манифеста выделен — скопируйте его вручную.");
      }
    });

    async function callApi(method, params, token) {
      const result = await vkBridge.send("VKWebAppCallAPIMethod", {
        method,
        params: Object.assign({}, params, { v: version, access_token: token })
      });
      if (result && result.response !== undefined) return result.response;
      throw new Error(method + ": " + JSON.stringify(result && result.error || result));
    }
    async function getToken() {
      await vkBridge.send("VKWebAppInit");
      const appId = Number(new URLSearchParams(location.search).get("vk_app_id")) || 54500370;
      const auth = await vkBridge.send("VKWebAppGetAuthToken", { app_id: appId, scope: "photos" });
      if (!auth || !auth.access_token) throw new Error("VK не выдал разрешение photos.");
      return auth.access_token;
    }
    function largestUrl(photo) {
      const sizes = (photo && photo.sizes || []).filter(item => item && item.url);
      sizes.sort((a, b) => (b.width * b.height) - (a.width * a.height));
      return sizes.length ? sizes[0].url : null;
    }
    function corsCheck(url) {
      return new Promise(resolve => {
        const image = new Image();
        image.crossOrigin = "anonymous";
        image.onload = () => resolve(true);
        image.onerror = () => resolve(false);
        image.src = url;
        setTimeout(() => resolve(false), 12000);
      });
    }
    async function uploadImage(entry, token) {
      const encoded = entry.path.split("/").map(encodeURIComponent).join("/");
      const pagesProject = entry.repo === "dynamic-guide" ? "dynamic-guide" : "vkaguide";
      const source = `https://gospodeensobaka-afk.github.io/${pagesProject}/${encoded}`;
      const response = await fetch(source, { mode: "cors", cache: "no-store" });
      if (!response.ok) throw new Error("GitHub HTTP " + response.status + " для " + entry.path);
      const blob = await response.blob();
      const file = new File([blob], entry.path.split("/").pop(), { type: blob.type || "image/jpeg" });

      const uploadServer = await callApi("photos.getWallUploadServer", {}, token);
      if (!uploadServer || !uploadServer.upload_url) throw new Error("VK не вернул адрес загрузки");
      const form = new FormData();
      form.append("photo", file, file.name);
      const uploadedResponse = await fetch(uploadServer.upload_url, { method: "POST", body: form });
      if (!uploadedResponse.ok) throw new Error("VK upload HTTP " + uploadedResponse.status);
      const data = await uploadedResponse.json();
      const saved = await callApi("photos.saveWallPhoto", {
        server: data.server,
        photo: data.photo,
        hash: data.hash
      }, token);
      const photo = Array.isArray(saved) ? saved[0] : null;
      const url = largestUrl(photo);
      if (!url) throw new Error("VK не вернул CDN-ссылку для " + entry.path);
      uploaded[entry.repo + "/" + entry.path] = url;
      const cors = await corsCheck(url);
      refreshManifest();
      return cors;
    }
    startButton.addEventListener("click", async () => {
      startButton.disabled = true;
      let corsFailures = 0;
      const errors = [];
      try {
        showStatus("Запрашиваю разрешение VK на фотографии…");
        const token = await getToken();
        for (let i = 0; i < images.length; i++) {
          const entry = images[i];
          const key = entry.repo + "/" + entry.path;
          showStatus(`Загружаю ${i + 1}/${images.length}: ${key}`);
          try {
            if (!await uploadImage(entry, token)) corsFailures++;
          } catch (error) {
            errors.push(key + " — " + (error.message || String(error)));
          }
        }
        refreshManifest();
        const count = Object.keys(uploaded).length;
        showStatus(`Завершено: ${count}/${images.length} фотографий загружено.\nCORS VK CDN: ${count - corsFailures}/${count} ссылок прошли проверку.${errors.length ? "\n\nОшибки:\n" + errors.join("\n") : ""}${corsFailures ? "\n\nКарта MapLibre может не показать изображения, если CORS не разрешён." : ""}` , errors.length || corsFailures > 0);
      } catch (error) {
        showStatus("Ошибка VK Bridge/авторизации: " + (error.message || String(error)), true);
      } finally {
        startButton.disabled = false;
      }
    });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();

</script>
<script>
  var GROUP = "236911218";
  var V = "5.199";
  var NAMES = ["Площадь","Сад слёз","Дом Шамиля","Розовый дом","7-я поликлиника","Синий дом","Дом Каушчи","Апанаевская мечеть","Озеро Кабан","Памятник Марджани","Мечеть","Исламский колледж","Точка на карте","Финал"];
  var APP_ID = Number(new URLSearchParams(location.search).get("vk_app_id")) || 0;
  var ctoken = null, busy = false;

  var logEl = document.getElementById("log");
  function log(text, cls) { logEl.className = cls || ""; logEl.textContent = text; }
  function err(e) { try { return JSON.stringify(e && e.error_data ? e.error_data : e); } catch (x) { return String(e); } }

  var grid = document.getElementById("grid");
  NAMES.forEach(function (name, i) {
    var n = i + 1, b = document.createElement("button");
    b.className = "q"; b.setAttribute("data-n", n);
    b.innerHTML = "<b>" + n + "</b>" + name;
    grid.appendChild(b);
  });
  document.querySelectorAll("[data-n]").forEach(function (b) {
    b.onclick = function () { send(Number(b.getAttribute("data-n"))); };
  });

  function mark(n) {
    document.querySelectorAll("[data-n]").forEach(function (b) {
      b.classList.toggle("active", Number(b.getAttribute("data-n")) === n);
    });
    document.querySelector("#now b").textContent = n === 0 ? "пауза" : n + " · " + NAMES[n - 1];
  }

  vkBridge.send("VKWebAppInit").catch(function () {});

  async function getToken() {
    if (ctoken) return ctoken;
    var args = { app_id: APP_ID, group_id: Number(GROUP), scope: "manage" };
    try {
      ctoken = (await vkBridge.send("VKWebAppGetCommunityToken", args)).access_token;
    } catch (e) {
      log("Подключаю приложение к сообществу, выбери свою группу…");
      await vkBridge.send("VKWebAppAddToCommunity");
      ctoken = (await vkBridge.send("VKWebAppGetCommunityToken", args)).access_token;
    }
    return ctoken;
  }

  function api(method, params) {
    params.v = V; params.access_token = ctoken;
    return vkBridge.send("VKWebAppCallAPIMethod", { method: method, params: params });
  }

  async function readCurrent() {
    var r = await api("groups.getById", { group_id: GROUP, fields: "description" });
    var g = r.response.groups ? r.response.groups[0] : r.response[0];
    var text = String((g && g.description) || "").trim();
    if (text === "") return 0;
    return /^\d+$/.test(text) ? Number(text) : null;
  }

  async function refresh() {
    try {
      await getToken();
      var cur = await readCurrent();
      if (cur !== null) mark(cur);
      log("Готово. Жми номер загадки.", "ok");
    } catch (e) { log("Не удалось подключиться: " + err(e), "bad"); }
  }

  async function send(n) {
    if (busy) return;
    busy = true;
    document.querySelectorAll("button").forEach(function (b) { b.disabled = true; });
    try {
      await getToken();
      await api("groups.edit", { group_id: GROUP, description: String(n) });
      var cur = await readCurrent();
      if (cur !== null) mark(cur);
      if (cur === n) log("Готово: у туристов загадка " + (n === 0 ? "«пауза»" : n), "ok");
      else log("Записано " + n + ", но ВК показывает: " + cur, "bad");
    } catch (e) {
      log("Не получилось: " + err(e), "bad");
    }
    setTimeout(function () {
      document.querySelectorAll("button").forEach(function (b) { b.disabled = false; });
      busy = false;
    }, 1200);
  }

  refresh();
</script>
</body>
</html>

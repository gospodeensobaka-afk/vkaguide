<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Тест способов</title>
<style>
  :root { --bg:#0b0e14; --card:#171b26; --line:#2b3242; --text:#eef0f5; --muted:#8d95a6; --accent:#6fb1ff; --ok:#5dd28a; --bad:#ff7a70; }
  * { box-sizing:border-box; }
  body { margin:0; padding:88px 14px 40px; background:var(--bg); color:var(--text); font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  h1 { margin:0 0 4px; font-size:20px; }
  p { margin:0 0 16px; color:var(--muted); font-size:14px; }
  button { width:100%; margin-top:10px; padding:14px; border:0; border-radius:10px; background:var(--accent); color:#0b1320; font-size:16px; font-weight:600; }
  button[disabled] { opacity:.5; }
  small { display:block; margin-top:4px; color:var(--muted); font-size:12px; }
  #log { margin-top:20px; padding:12px; border-radius:10px; background:var(--card); border:1px solid var(--line); font:13px/1.5 ui-monospace,Menlo,monospace; white-space:pre-wrap; word-break:break-word; min-height:80px; }
  .ok { color:var(--ok); } .bad { color:var(--bad); } .info { color:var(--muted); }
</style>
</head>
<body>
  <h1>Тест способов</h1>
  <p>Нажимай по очереди A, B, C. После каждого смотри на результат внизу.</p>

  <button id="bA">A. Опубликовать пост «0»</button>
  <small>Заодно поставит квест на паузу.</small>

  <button id="bB">B. Написать комментарий под последним постом</button>
  <small>Появится комментарий «тест», потом его можно удалить.</small>

  <button id="bC">C. Описание группы через токен сообщества</button>
  <small>Может открыться окно «добавить приложение в сообщество», выбери свою группу.</small>

  <div id="log">Ждём…</div>

<script src="vk-bridge.min.js"></script>
<script>
  var GROUP = "236911218", V = "5.199";
  var APP_ID = Number(new URLSearchParams(location.search).get("vk_app_id")) || 0;
  var logEl = document.getElementById("log");
  var first = true;

  function log(text, cls) {
    if (first) { logEl.textContent = ""; first = false; }
    var d = document.createElement("div");
    d.className = cls || "info";
    d.textContent = text;
    logEl.appendChild(d);
  }
  function err(e) { try { return JSON.stringify(e && e.error_data ? e.error_data : e); } catch (x) { return String(e); } }

  vkBridge.send("VKWebAppInit").catch(function () {});

  function api(token, method, params) {
    params.v = V; params.access_token = token;
    return vkBridge.send("VKWebAppCallAPIMethod", { method: method, params: params });
  }
  async function userToken(scope) {
    var r = await vkBridge.send("VKWebAppGetAuthToken", { app_id: APP_ID, scope: scope });
    return r.access_token;
  }
  function lock(b, on) { b.disabled = on; }

  /* A: пост */
  document.getElementById("bA").onclick = async function () {
    var b = this; lock(b, true); log("— Тест A —");
    try {
      var t = await userToken("wall");
      var r = await api(t, "wall.post", { owner_id: "-" + GROUP, from_group: 1, message: "0" });
      log("A: ПОЛУЧИЛОСЬ. Ответ: " + JSON.stringify(r.response), "ok");
    } catch (e) { log("A: не вышло: " + err(e), "bad"); }
    lock(b, false);
  };

  /* B: комментарий */
  document.getElementById("bB").onclick = async function () {
    var b = this; lock(b, true); log("— Тест B —");
    try {
      var t = await userToken("wall");
      var w = await api(t, "wall.get", { owner_id: "-" + GROUP, count: 1 });
      var post = w.response.items[0];
      log("Последний пост: id " + post.id + " «" + (post.text || "").slice(0, 15) + "»");
      var r = await api(t, "wall.createComment", { owner_id: "-" + GROUP, post_id: post.id, from_group: GROUP, message: "тест" });
      log("B: ПОЛУЧИЛОСЬ. Ответ: " + JSON.stringify(r.response), "ok");
    } catch (e) { log("B: не вышло: " + err(e), "bad"); }
    lock(b, false);
  };

  /* C: описание группы через токен сообщества */
  async function communityToken() {
    var args = { app_id: APP_ID, group_id: Number(GROUP), scope: "manage" };
    try {
      return (await vkBridge.send("VKWebAppGetCommunityToken", args)).access_token;
    } catch (e) {
      log("Токен сообщества не выдан сразу (" + err(e) + "). Пробую добавить приложение в сообщество…");
      var add = await vkBridge.send("VKWebAppAddToCommunity");
      log("Добавлено в сообщество: " + JSON.stringify(add));
      return (await vkBridge.send("VKWebAppGetCommunityToken", args)).access_token;
    }
  }

  document.getElementById("bC").onclick = async function () {
    var b = this; lock(b, true); log("— Тест C —");
    try {
      var ct = await communityToken();
      log("Токен сообщества получен.", "ok");
      await api(ct, "groups.edit", { group_id: GROUP, description: "7" });
      log("Описание записано.", "ok");
      var g = await api(ct, "groups.getById", { group_id: GROUP, fields: "description" });
      var item = g.response.groups ? g.response.groups[0] : g.response[0];
      log("Читаю обратно: «" + (item.description || "") + "»", "ok");
      await api(ct, "groups.edit", { group_id: GROUP, description: "" });
      log("C: ПОЛУЧИЛОСЬ целиком. Описание очищено.", "ok");
    } catch (e) { log("C: не вышло: " + err(e), "bad"); }
    lock(b, false);
  };
</script>
</body>
</html>
